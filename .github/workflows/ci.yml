name: CI

on:
  pull_request:

jobs:
  ci:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - run: bun install --frozen-lockfile

      - run: bunx playwright install --with-deps chromium

      - parallel:
          - name: Lint
            run: bun run lint

          - name: Format
            run: bunx prettier --check .

          - name: Test
            run: bun run test
